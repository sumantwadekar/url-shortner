{% extends "base.html" %}

{% block content %}
<div class="container">
    <form hx-post="{{shorten_url}}" hx-target="#result" hx-swap="innerHTML">
        {% csrf_token %}
        <label for="url">Enter URL:</label>
        <input type="url" id="url" name="url" required placeholder="https://example.com">
        <button type="submit">Shorten</button>
    </form>

    <div id="result"></div>
</div>
{% endblock %}
